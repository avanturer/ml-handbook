name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  handbook:
    name: Целостность хендбука
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить структуру глав и внутренние ссылки
        run: python tools/check_handbook.py

      - name: Проверить покрытие обязательных тем
        run: python tools/check_coverage.py

      - name: Проверить, что навигация не разошлась с файлами
        run: |
          python tools/build_nav.py > /dev/null
          if ! git diff --quiet -- docs mkdocs.yml; then
            echo "::error::Навигация устарела. Запустите: python tools/build_nav.py"
            git diff --stat -- docs mkdocs.yml
            exit 1
          fi

  trainer:
    name: Тренажёр кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r code/requirements.txt

      - name: Эталонные решения должны проходить все тесты
        env:
          HANDBOOK_CHECK_SOLUTIONS: "1"
        run: pytest code/tests -q

      - name: Скелеты должны падать (иначе задание уже решено за читателя)
        run: |
          if pytest code/tests -q > /dev/null 2>&1; then
            echo "::error::Тесты проходят на пустых скелетах — задание сломано"
            exit 1
          fi
          echo "Скелеты падают, как и задумано."

  links:
    name: Внешние ссылки
    runs-on: ubuntu-latest
    # Отдельной задачей: сеть бывает нестабильна, и это не должно блокировать мердж
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить, что ссылки отвечают
        run: python tools/check_links.py
